<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="Arial, Helvetica, sans-serif">
  <!-- Nested classes of sequences: i.i.d. ⊂ exchangeable ⊂ c.i.d. -->
  <!-- c.i.d. (outer) -->
  <ellipse cx="700" cy="320" rx="660" ry="285" fill="#D9822B" fill-opacity="0.10" stroke="#D9822B" stroke-width="3"/>
  <!-- exchangeable (middle) -->
  <ellipse cx="560" cy="350" rx="430" ry="215" fill="#00883A" fill-opacity="0.12" stroke="#00883A" stroke-width="3"/>
  <!-- i.i.d. (inner) -->
  <ellipse cx="420" cy="385" rx="200" ry="120" fill="#626468" fill-opacity="0.14" stroke="#626468" stroke-width="3"/>

  <!-- c.i.d. labels (region outside exchangeable) -->
  <text x="1130" y="190" fill="#D9822B" font-size="34" font-weight="700" text-anchor="middle">c.i.d.</text>
  <text x="1130" y="228" fill="#2F2F2F" font-size="23" text-anchor="middle">martingale posteriors</text>
  <text x="1110" y="330" fill="#626468" font-size="20" text-anchor="middle">order may matter</text>
  <text x="1110" y="380" fill="#626468" font-size="20" text-anchor="middle" font-style="italic">e.g. Fong-rate / copula</text>
  <text x="1110" y="406" fill="#626468" font-size="20" text-anchor="middle" font-style="italic">predictive updates</text>

  <!-- exchangeable labels (region outside i.i.d.) -->
  <text x="640" y="200" fill="#00883A" font-size="32" font-weight="700" text-anchor="middle">exchangeable</text>
  <text x="640" y="237" fill="#2F2F2F" font-size="22" text-anchor="middle">traditional Bayes (de Finetti)</text>
  <text x="800" y="360" fill="#626468" font-size="20" text-anchor="middle">learning, order irrelevant</text>
  <text x="800" y="410" fill="#626468" font-size="20" text-anchor="middle" font-style="italic">e.g. normal–normal model,</text>
  <text x="800" y="436" fill="#626468" font-size="20" text-anchor="middle" font-style="italic">Bayesian bootstrap</text>

  <!-- i.i.d. labels -->
  <text x="420" y="365" fill="#2F2F2F" font-size="30" font-weight="700" text-anchor="middle">i.i.d.</text>
  <text x="420" y="402" fill="#626468" font-size="20" text-anchor="middle">known distribution:</text>
  <text x="420" y="428" fill="#626468" font-size="20" text-anchor="middle">nothing is learned</text>
</svg>
